name: habitmaker
description: "HabitMaker is a habit tracking app that helps users build and maintain positive habits through a user-friendly interface and engaging features."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  build_runner: ^2.15.1
  curved_navigation_bar: ^1.0.6
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  firebase_app_check: ^0.4.8
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  hive_ce_generator: ^1.11.1
  lottie: ^3.3.3
  percent_indicator: ^4.2.5
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  vibration: ^3.2.1
  wheel_slider: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie files/
    - .env
  
  fonts:
    - family: PressStart2P
      fonts:
        - asset: fonts/PressStart2P-Regular.ttf
